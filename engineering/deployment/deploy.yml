# yaml-language-server: $schema=../../../../../conventions/deployment/descriptor/deploy.schema.json
# What the Files domain deploys: one service hosting the Form 1 module, its HTTP API, the hosted pages and the admin
# console. Format and rules: wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md. Hostnames, secrets
# and environments live in Wheelhouse targets, never here. Paths are relative to engineering/.
descriptor: 2
product: files
platform: linux/amd64
# Dev runs as .NET Development, prod as Production; appsettings.Development.json holds defaults only, and an IDE
# run's own values live in appsettings.Local.json.
dotnetEnvironment: true
# The dev check: once a dev rollout succeeds, the service's own image asks it for its health and its status over the
# platform network. A pass lets auto-promote take the release. Each request carries the probe Host (localhost): a
# target's AllowedHosts names its public hosts plus localhost, so the service's platform-network name in the URL
# would answer 400 from host filtering.
verify:
  service: files
  command:
    - sh
    - -c
    - >-
      curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_FILES/health"
      && curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_FILES/api/system/status"
      && echo "health and status answered"
  timeout: 1m
# Two host roles: the public front door for the API and the hosted pages, and the private admin console. One app
# serves both; Wheelhouse binds each site to its own host per environment.
sites:
  app: { primary: true }
  console: { exposure: private }
shared:
  - codebase/files.backend-services/Directory.*.props
  - codebase/files.backend-services/global.json
services:
  files:
    build:
      dockerfile: deployment/Dockerfile
    paths:
      - codebase/files.backend-services/**
      - codebase/files.frontend-services/**
    health: /health
    memory: 256m
    # Typed keys (pipelines v0.10.0): Wheelhouse checks each saved value against its type; a required key joins
    # settings.required. The target's settings file (/app/appsettings.Target.json) supplies the SQLite path on the
    # data volume; the name ends in ConnectionString, so Wheelhouse keeps the value in its vault. The bytes live on the
    # same volume; signed file URLs need the secret signing key, and point at the app site (Sites:app:Url) unless
    # Files:Delivery:BaseUrl names another content host. API keys and token issuers are optional: without them the
    # API answers 401 and only the pages and file links serve.
    # Trusted issuers (t8 C8): P1 trusts one, Ocharo's Identity, as the tenant `ocharo`; its tokens name the tenant's own
    # host with its slash (https://files.{domain}/). Identity's revocation signals arrive at {audience}signals/identity,
    # the SignalUrl that issuer's registry lists. API keys (Files:Auth:ApiKeys) serve only callers outside Identity.
    # The operator key (Wheelhouse sends X-Api-Key: files_ + Files:Operator:ApiKey) opens imports and mints their tokens;
    # it holds files.tenants alone and reaches no file route. Import tokens live Files:Imports:TokenLifetime.
    settings:
      keys:
        DatabaseSettings:ConnectionString: { required: true }
        Storage:Root: { default: /data/blobs }
        Files:Delivery:SigningKey: { secret: true, required: true }
        Files:Delivery:BaseUrl: { type: url }
        Files:Auth:Audience: { type: url }
        Files:Auth:Issuers:0:Issuer: { type: url }
        Files:Auth:Issuers:0:TenantId: { default: ocharo }
        Files:Auth:Issuers:0:Audiences:0: { type: url }
        # WebP variants for every app with no policy of its own: the widths Ocharo's apps show (files-integration #27).
        Files:DefaultPolicy:Variants:0: { default: "480" }
        Files:DefaultPolicy:Variants:1: { default: "900" }
        Files:DefaultPolicy:Variants:2: { default: "1200" }
        Files:DefaultPolicy:Variants:3: { default: "1400" }
        Files:Operator:ApiKey: { secret: true, generate: { random: 16, encoding: hex } }
        Files:Imports:TokenLifetime: { default: "06:00:00" }
    volumes:
      data: /data
    # The pages at /, the contract's HTTP mirror under the same host's /api: /api routes ahead of /, never /apiary.
    sites:
      app: { paths: [/, /api] }
      console: { paths: [/, /api] }
